[project]
name = "insurance-claims-pricing"
version = "0.1.0"
description = "Claim frequency, severity and pure-premium modelling on French MTPL data"
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scikit-learn", "statsmodels", "xgboost", "lightgbm",
  "shap", "mlflow", "duckdb", "matplotlib", "seaborn", "pyyaml", "rdata", "pyarrow", "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "ruff"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
# real errors (E4/E7/E9, pyflakes F), import order (I) and modern syntax (UP); line length is not enforced
select = ["E4", "E7", "E9", "F", "I", "UP"]
